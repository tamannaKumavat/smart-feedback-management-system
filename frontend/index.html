<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/ruag-no-bg.png" />
    <link rel="apple-touch-icon" href="/ruag-no-bg.png" />
    <title>Smart Feedback Management System</title>
    <script>
      try {
        var theme = localStorage.getItem("ruag-client-theme");
        if (theme === "dark") {
          document.documentElement.style.colorScheme = "dark";
          document.documentElement.dataset.clientTheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
